name: Paopao3 Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: paopao3
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Restore state
        uses: actions/download-artifact@v4
        with:
          name: paopao3-state
          path: .
        continue-on-error: true

      - name: Run scheduler
        env:
          BOT_USER: "自动房间-1"
          BOT_PASS: "王敬淇2359921833"
        run: python paopao3_scheduler.py

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paopao3-state
          path: paopao3_state.json
          retention-days: 1
