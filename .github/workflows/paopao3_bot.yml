name: Paopao3 Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: paopao3
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scheduler
        run: python paopao3_scheduler.py

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paopao3-state
          path: paopao3_state.json
          retention-days: 1

      - name: Auto restart
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR_BJ=$(( ($(date -u +%H) + 8) % 24 ))
          if [ $HOUR_BJ -ge 7 ] && [ $HOUR_BJ -lt 22 ]; then
            echo "BJ ${HOUR_BJ}:00, working, restart in 30s..."
            sleep 30
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paopao3_bot.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "Triggered"
          else
            echo "BJ ${HOUR_BJ}:00, off hours"
          fi

      - name: Restore state
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: paopao3-state
          path: .
        continue-on-error: true
