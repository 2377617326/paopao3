name: Paopao3 Scheduler

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: paopao3
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scheduler
        env:
          BOT_USER: "9258"
          BOT_PASS: "321"
        run: |
          python paopao3_scheduler.py

      - name: Auto restart
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR_BJ=$(( ($(date -u +%H) + 8) % 24 ))
          if [ $HOUR_BJ -ge 7 ] && [ $HOUR_BJ -lt 22 ]; then
            echo "BJ time ${HOUR_BJ}:00, working hours, restarting..."
            sleep 30
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paopao3_bot.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "New run triggered"
          else
            echo "BJ time ${HOUR_BJ}:00, off hours, no restart"
          fi
